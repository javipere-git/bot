; ============================================================================
; PLANTILLA de credenciales.
;
; Copia este archivo como 'credentials.ini' (en la misma carpeta) y completa lo
; que vayas a usar. El archivo real (credentials.ini) NUNCA se sube al repo: es
; propio de cada maquina.
;
; Cada seccion es opcional: si dejas las claves de un broker vacias, ese broker
; simplemente NO aparece como opcion al abrir la app.
;
; SEGURIDAD: copia las claves a otra PC por pendrive o escribiendolas a mano.
; Nunca por mail, chat ni carpeta compartida en la nube.
; ============================================================================

[tradier]
; --- PAPER (sandbox, dinero simulado) ---
sandbox_token = PEGA_TU_TOKEN_DE_SANDBOX_ACA
sandbox_account_id =

; --- PRODUCCION (cuenta real) ---
; Se usa para ver precios en vivo (lectura) y, SOLO si activas el modo LIVE,
; para operar tu cuenta real.
production_token = PEGA_TU_TOKEN_DE_PRODUCCION_ACA

; >>> GATILLO DEL MODO LIVE DE TRADIER <<<
; Numero de cuenta REAL. Mientras este vacio, Tradier LIVE queda deshabilitado.
production_account_id =

[alpaca]
; --- PAPER (dinero simulado) ---
paper_key_id =
paper_secret =

; Feed de datos: "iex" (gratis, UN solo exchange, NO es el NBBO real) o "sip"
; (plan Algo Trader Plus, NBBO consolidado real).
data_feed = iex

; >>> GATILLO DEL MODO LIVE DE ALPACA (cuenta REAL) <<<
; Claves de tu cuenta REAL (distintas de las paper). Mientras esten vacias,
; Alpaca LIVE queda deshabilitado.
live_key_id =
live_secret =

[safety]
; Tope de acciones por orden en modo LIVE (el bot NO arranca si lo supera).
live_max_shares = 25

[logs]
; Carpeta donde se guardan los archivos de registro. Vacio = la carpeta del
; proyecto. Si apuntas a una carpeta sincronizada (Google Drive, OneDrive...),
; los logs de esta PC se pueden revisar desde otra maquina.
; El archivo se llama registro_<NOMBRE-DE-ESTA-PC>_<perfil>.log, asi los logs de
; varias maquinas nunca se pisan entre si.
; Ejemplo:  carpeta = C:\Users\TuUsuario\Mi unidad\bot-logs
carpeta =
